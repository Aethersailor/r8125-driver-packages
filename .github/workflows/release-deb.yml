name: Release Debian package

on:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:
    inputs:
      pkgrel:
        description: "Debian package revision"
        required: false
        default: "1"
      force:
        description: "Replace the existing release and tag if they already exist"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve inputs
        id: inputs
        run: |
          echo "pkgrel=${{ github.event.inputs.pkgrel || '1' }}" >> "$GITHUB_OUTPUT"
          echo "force=${{ github.event.inputs.force || 'false' }}" >> "$GITHUB_OUTPUT"

      - name: Discover latest source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/discover-source.py --pretty > build-source.json
          cat build-source.json

      - name: Compute release version
        id: version
        run: |
          DRIVER_VERSION="$(python3 -c 'import json; print(json.load(open("build-source.json"))["driver_version"])')"
          PACKAGE_VERSION="${DRIVER_VERSION}-${{ steps.inputs.outputs.pkgrel }}"
          TAG="v${PACKAGE_VERSION}"
          echo "driver_version=$DRIVER_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        if: steps.inputs.outputs.force != 'true'
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch source
        if: steps.inputs.outputs.force == 'true' || steps.existing.outputs.exists != 'true'
        run: |
          python3 scripts/fetch-source.py --metadata build-source.json --pretty > source-metadata.json
          cat source-metadata.json

      - name: Build deb
        if: steps.inputs.outputs.force == 'true' || steps.existing.outputs.exists != 'true'
        run: |
          scripts/build-deb.sh \
            --source "$(python3 -c 'import json; print(json.load(open("source-metadata.json"))["source_path"])')" \
            --version "${{ steps.version.outputs.driver_version }}" \
            --pkgrel "${{ steps.inputs.outputs.pkgrel }}"

      - name: Smoke test deb
        if: steps.inputs.outputs.force == 'true' || steps.existing.outputs.exists != 'true'
        run: |
          scripts/smoke-test-deb.sh \
            "dist/r8125-dkms_${{ steps.version.outputs.package_version }}_all.deb" \
            "${{ steps.version.outputs.driver_version }}"

      - name: Prepare release assets
        if: steps.inputs.outputs.force == 'true' || steps.existing.outputs.exists != 'true'
        run: |
          SOURCE_ASSET="$(python3 -c 'import json; print(json.load(open("source-metadata.json"))["asset_name"])')"
          cp "$(python3 -c 'import json; print(json.load(open("source-metadata.json"))["source_path"])')" "dist/$SOURCE_ASSET"
          python3 scripts/make-release-notes.py \
            --metadata source-metadata.json \
            --build-options config/build-options.env \
            --package-version "${{ steps.version.outputs.package_version }}" > dist/release-notes.md
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          with open("source-metadata.json", encoding="utf-8") as handle:
              metadata = json.load(handle)
          metadata["package_name"] = "r8125-dkms"
          metadata["package_version"] = os.environ["PACKAGE_VERSION"]
          metadata["release_tag"] = os.environ["RELEASE_TAG"]
          metadata["build_time_utc"] = datetime.now(timezone.utc).isoformat()
          metadata["github_run_id"] = os.environ.get("GITHUB_RUN_ID")
          build_options = {}
          with open("config/build-options.env", encoding="utf-8") as handle:
              for line in handle:
                  line = line.strip()
                  if line and not line.startswith("#"):
                      key, value = line.split("=", 1)
                      build_options[key] = value
          metadata["build_options"] = build_options
          with open("dist/provenance.json", "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          (cd dist && sha256sum * > SHA256SUMS)
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}

      - name: Remove existing release for forced rebuild
        if: steps.inputs.outputs.force == 'true'
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub release
        if: steps.inputs.outputs.force == 'true' || steps.existing.outputs.exists != 'true'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --notes-file dist/release-notes.md \
            dist/r8125-${{ steps.version.outputs.driver_version }}.tar.* \
            dist/r8125-dkms_${{ steps.version.outputs.package_version }}_all.deb \
            dist/SHA256SUMS \
            dist/provenance.json \
            dist/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
