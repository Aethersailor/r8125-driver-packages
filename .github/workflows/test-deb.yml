name: Test Debian package

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dkms \
            linux-headers-generic \
            linux-headers-generic-hwe-24.04 \
            shellcheck

      - name: Static checks
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          shellcheck scripts/*.sh packaging/debian/postinst packaging/debian/prerm

      - name: Discover latest source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/discover-source.py --pretty > build-source.json
          cat build-source.json

      - name: Fetch source
        run: |
          python3 scripts/fetch-source.py --metadata build-source.json --pretty > source-metadata.json
          cat source-metadata.json

      - name: Validate release plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_plan.py \
            --metadata source-metadata.json \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --pretty

      - name: Build deb
        run: |
          scripts/build-deb.sh \
            --source "$(python3 -c 'import json; print(json.load(open("source-metadata.json"))["source_path"])')" \
            --version "${{ steps.plan.outputs.driver_version }}" \
            --pkgrel "${{ steps.plan.outputs.pkgrel }}"

      - name: Smoke test deb
        run: |
          scripts/smoke-test-deb.sh \
            "dist/r8125-dkms_${{ steps.plan.outputs.package_version }}_all.deb" \
            "${{ steps.plan.outputs.driver_version }}"

      - name: Compile DKMS module
        run: |
          sudo scripts/compile-test-dkms.sh \
            "dist/r8125-dkms_${{ steps.plan.outputs.package_version }}_all.deb" \
            "${{ steps.plan.outputs.driver_version }}" \
            2
